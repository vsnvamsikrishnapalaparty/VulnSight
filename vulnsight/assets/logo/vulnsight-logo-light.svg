<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img" aria-label="VulnSight">
  <title>VulnSight</title>
  <desc>VulnSight wordmark with scanner-reticle logomark in a rounded-square container. Use on light backgrounds.</desc>
  <g transform="translate(8, 10)">
    <rect x="0" y="0" width="40" height="40" rx="9" fill="#fef2f2" stroke="#fecaca" stroke-width="0.6"/>
    <g transform="translate(4, 4)">
      <circle cx="16" cy="16" r="11" fill="none" stroke="#dc2626" stroke-width="1.8"/>
      <line x1="16" y1="3"  x2="16" y2="7"  stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16" y1="25" x2="16" y2="29" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="3"  y1="16" x2="7"  y2="16" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="25" y1="16" x2="29" y2="16" stroke="#dc2626" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="24" cy="8" r="3.2" fill="#d97706"/>
    </g>
  </g>
  <text x="60" y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#0f172a">Vuln<tspan fill="#dc2626">Sight</tspan></text>
</svg>
