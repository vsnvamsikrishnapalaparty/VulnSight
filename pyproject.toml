# ─────────────────────────────────────────────────────────────
#  VulnSight packaging spec
# ─────────────────────────────────────────────────────────────
#  Install for development (changes to source take effect immediately):
#     pip install -e .
#
#  Install regular:
#     pip install .
#
#  Once installed, the `vulnsight` command is on your $PATH:
#     vulnsight -i centos:6
#     vulnsight --root-path /
# ─────────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnsight"
version = "1.0.0"
description = "Container image vulnerability scanner with custom risk scoring and threat-intel enrichment"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Venkata Sai Nataraja Vamsi Krishna Palaparty" }
]
keywords = [
    "vulnerability-scanner",
    "container-security",
    "sbom",
    "cve",
    "risk-scoring",
    "nvd",
    "epss",
    "cisa-kev",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
]

# Runtime dependencies. System binaries (syft, grype, docker) are
# installed separately -- see README.md.
dependencies = [
    "docker>=7.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "weasyprint>=60.0",
]

[project.urls]
Homepage = "https://github.com/vamsikrishnapalaparty/vulnsight"
Repository = "https://github.com/vamsikrishnapalaparty/vulnsight"
Issues = "https://github.com/vamsikrishnapalaparty/vulnsight/issues"

# ─────────────────────────────────────────────────────────────
#  Entry point: makes `vulnsight` a real command on $PATH
# ─────────────────────────────────────────────────────────────
#  When pip installs this package, it creates a small launcher
#  script (in the venv's bin/ or your user's ~/.local/bin/) that
#  calls vulnsight.scanner:main() when you run `vulnsight`.
[project.scripts]
vulnsight = "vulnsight.scanner:main"

# ─────────────────────────────────────────────────────────────
#  Package discovery
# ─────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
include = ["vulnsight*"]
exclude = ["tests*", "artifacts*", "cache*", "container_fs*"]

# Include non-Python files: the risk-engine config JSON and the
# logo assets ship inside the package.
[tool.setuptools.package-data]
"vulnsight" = [
    "risk_engine/*.json",
    "assets/logo/*.svg",
    "assets/logo/*.md",
]
